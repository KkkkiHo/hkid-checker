

<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香港身份證校驗碼工具</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f4f7;color:#202938;margin:0;padding:22px}
main{max-width:520px;margin:25px auto;background:#fff;padding:26px 22px;border-radius:22px;box-shadow:0 8px 30px #0000000b}
h1{font-size:25px;line-height:1.4;margin:8px 0 18px}
p{line-height:1.7;color:#596579}
input{width:100%;padding:15px;font-size:20px;border:2px solid #b7c0ce;border-radius:13px;margin:12px 0;outline-color:#1769e0}
button{border:0;border-radius:12px;padding:14px 17px;font-size:17px;font-weight:600;background:#1769e0;color:white;margin:5px 5px 5px 0;cursor:pointer}
.secondary{background:#e8edf5;color:#202938}
.result{margin-top:20px;padding:16px;border-radius:12px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
.good{background:#e0f7e8;color:#155b32}
.bad{background:#ffe8e8;color:#8b2020}
.info{background:#edf3ff;color:#183c77}
.small{font-size:13px;color:#687386}
.label{font-weight:650;margin-top:22px}
</style>
</head>
<body>
<main>
<h1>香港身份證校驗碼工具</h1>
<p>計算身份證尾數，或檢查已有號碼的校驗碼是否吻合。</p>

<form id="form">
<label class="label" for="hkid">身份證號碼</label>
<input id="hkid" type="text" placeholder="例如 G263398 或 G263398(0)"
autocomplete="off" autocapitalize="characters" spellcheck="false" required>

<button type="button" id="calculate">計算校驗碼</button>
<button type="submit">檢查校驗碼</button>
<button type="button" class="secondary" id="clear">清除</button>
</form>

<div id="result" class="result info" aria-live="polite">請輸入號碼，然後選擇要執行的功能。</div>
<button type="button" id="copy" class="secondary">複製結果</button>

<p class="small">私隱提示：本工具在瀏覽器本機計算，不會由本頁程式傳送輸入內容到伺服器。校驗碼吻合不代表身份證真實存在，亦不能核實持有人身份。</p>
</main>

<script>
(function(){
const input=document.getElementById('hkid');
const result=document.getElementById('result');
let copyText='';

function parse(){
  const s=input.value.toUpperCase().replace(/\s+/g,'');
  const m=s.match(/^([A-Z]{1,2})([0-9]{6})(?:\(?([0-9A])\)?)?$/);
  if(!m) return null;
  return {prefix:m[1],digits:m[2],check:m[3]||null};
}

function expectedCheck(prefix,digits){
  const chars=prefix.length===1
    ? [' ',prefix,...digits]
    : [...prefix,...digits];
  const weights=[9,8,7,6,5,4,3,2];
  let sum=0;
  for(let i=0;i<8;i++){
    const c=chars[i];
    let v;
    if(c===' ') v=36;
    else if(/[A-Z]/.test(c)) v=c.charCodeAt(0)-65+10;
    else v=Number(c);
    sum+=v*weights[i];
  }
  const n=(11-(sum%11))%11;
  return n===10?'A':String(n);
}

function show(message,type,copy=''){
  result.className='result '+type;
  result.textContent=message;
  copyText=copy||message;
}

document.getElementById('calculate').addEventListener('click',function(){
  const p=parse();
  if(!p){
    show('格式不正確。請輸入一至兩個英文字母及六位數字，例如 G263398。','bad');
    return;
  }
  const c=expectedCheck(p.prefix,p.digits);
  const full=p.prefix+p.digits+'('+c+')';
  show('計算完成\n\n校驗碼：'+c+'\n完整格式：'+full,'good',full);
});

document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  const p=parse();
  if(!p || !p.check){
    show('請輸入完整號碼及校驗碼，例如 G263398(0)，再按「檢查校驗碼」。','bad');
    return;
  }
  const c=expectedCheck(p.prefix,p.digits);
  const full=p.prefix+p.digits+'('+p.check+')';
  if(p.check===c){
    show('校驗碼吻合 ✓\n\n輸入號碼：'+full+'\n計算校驗碼：'+c+'\n\n注意：這只代表校驗碼計算吻合。','good',full);
  }else{
    show('校驗碼不吻合 ✗\n\n輸入尾數：'+p.check+'\n正確計算尾數：'+c+'\n參考格式：'+p.prefix+p.digits+'('+c+')','bad',p.prefix+p.digits+'('+c+')');
  }
});

document.getElementById('clear').addEventListener('click',function(){
  input.value='';
  show('請輸入號碼，然後選擇要執行的功能。','info','');
  input.focus();
});

document.getElementById('copy').addEventListener('click',async function(){
  if(!copyText){
    show('請先計算或檢查號碼，再複製結果。','info');
    return;
  }
  try{
    await navigator.clipboard.writeText(copyText);
    show(result.textContent+'\n\n已複製：'+copyText,result.classList.contains('good')?'good':'bad',copyText);
  }catch(e){
    show(result.textContent+'\n\n如無法自動複製，請長按結果文字手動複製。',result.classList.contains('good')?'good':'bad',copyText);
  }
});
})();
</script>
</body>
</html>
